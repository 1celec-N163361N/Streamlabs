<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>سابا — شاهد العدّاد</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 11v5l3.5 2' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>

<div class="watch-page">
  <div class="watch-card">
    <div class="watch-top">
      <div class="brand" style="font-size:15px">
        <span class="brand-mark" style="width:26px;height:26px;border-radius:8px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></svg>
        </span>
        سابا
      </div>
      <div class="conn-pill" id="wConn"><span class="dot"></span><span>جارٍ الاتصال</span></div>
    </div>

    <div class="watch-timer" id="watchTimer" dir="ltr">--:--:--</div>
    <div class="watch-sub" id="watchSub">الوقت المتبقي على نهاية السابثون</div>

    <div class="progress" style="width:100%;margin-bottom:22px"><i id="watchBar"></i></div>

    <div class="stats" style="margin:0 0 18px;border-top:0;padding-top:0">
      <div class="stat"><b id="wSubs">٠</b><span>سبسكريب</span></div>
      <div class="stat"><b id="wBits">٠</b><span>بتس</span></div>
      <div class="stat"><b id="wDon">٠</b><span>دونيشن</span></div>
      <div class="stat"><b id="wMin">٠</b><span>دقيقة</span></div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:12.5px;color:#6d6d86">
      <span>آخر الدعم</span>
      <span id="wCount">٠</span>
    </div>

    <ul class="feed" id="wFeed" style="max-height:250px">
      <li class="feed-empty">بانتظار أول دعم…</li>
    </ul>

    <div style="text-align:center;margin-top:20px;font-size:12px;color:#6d6d86">
      الغرفة <span id="wRoom" style="font-family:var(--mono);color:#a2a2bb">----</span>
    </div>
  </div>
</div>

<script type="module" src="assets/js/live.js"></script>
</body>
</html>
