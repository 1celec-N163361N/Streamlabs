<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>سابا — عدّاد السابثون</title>
<meta name="description" content="تابع عدّاد السابثون لحظة بلحظة — الوقت المتبقي وكل دعم يزيده." />
<meta name="theme-color" content="#f3eee3" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%2317150f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f3eee3' stroke-width='2'/%3E%3Cpath d='M16 11v5l3.5 2' stroke='%23f3eee3' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="watch">

<div class="watch-wrap">

  <header class="watch-bar">
    <a class="brand" href="./" aria-label="سابا — الصفحة الرئيسية">
      <span class="brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M12 7v5.5l3.5 2" />
        </svg>
      </span>
      <span>سابا</span>
    </a>
    <div class="conn-pill" id="wConn" role="status" aria-live="polite">
      <span class="dot"></span><span>جارٍ الاتصال</span>
    </div>
  </header>

  <section class="watch-hero" aria-label="الوقت المتبقي">
    <div class="watch-kicker"><span class="dot"></span>سابثون مباشر</div>
    <div class="watch-timer" id="watchTimer" dir="ltr">--:--:--</div>
    <p class="watch-sub" id="watchSub">الوقت المتبقي على نهاية السابثون</p>
    <div class="watch-track" aria-hidden="true"><i id="watchBar"></i></div>
  </section>

  <div class="watch-stats">
    <div class="wstat"><b id="wSubs">0</b><span>سبسكريب</span></div>
    <div class="wstat"><b id="wBits">0</b><span>بتس</span></div>
    <div class="wstat"><b id="wDon">0</b><span>دونيشن</span></div>
    <div class="wstat"><b id="wMin">0</b><span>دقيقة</span></div>
  </div>

  <section class="watch-panel" aria-label="آخر الدعم">
    <div class="watch-panel-head">
      <h2>آخر الدعم</h2>
      <span class="cnt" id="wCount">0</span>
    </div>
    <ul class="feed" id="wFeed">
      <li class="feed-empty">بانتظار أول دعم…</li>
    </ul>
  </section>

  <footer class="watch-foot">
    <span>الغرفة <code id="wRoom">----</code></span>
    <span>سابا</span>
  </footer>

</div>

<script type="module" src="assets/js/live.js"></script>
</body>
</html>
